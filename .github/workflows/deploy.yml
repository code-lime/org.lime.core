name: Publish to GitHub Packages

on:
  push:
    tags: [ "*" ]
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

env:
  GITHUB_OWNER: ${{ github.repository_owner }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_PACKAGE_USERNAME: ${{ github.repository_owner }}
  GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  MODULE_MATRIX: |
    {
      "common": ["global"],
      "paper": ["global"],
      "velocity": ["global"],
      "fabric": ["1.20.1", "1.21.1", "1.21.4", "1.21.8"]
    }

jobs:
  matrix:
    name: Generate matrix
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}

    steps:
      - name: Generate matrix JSON
        id: gen
        shell: bash
        run: |
          set -euo pipefail

          echo "Input map:"
          echo '${{ env.MODULE_MATRIX }}'

          matrix=$(echo '${{ env.MODULE_MATRIX }}' \
            | jq -c '[to_entries[] | .key as $module | .value[] | {module: $module, variant: .}]')

          # Wrap in include
          matrix="{\"include\":$matrix}"

          echo "Generated matrix:"
          echo "$matrix"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.module }} / ${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: matrix

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: oracle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        run: |
          ./gradlew :${{ matrix.module }}:build \
            -Pvariable=${{ matrix.variant }} \
            -DincludeModules=${{ matrix.module }} \
            --build-cache --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.module }}-${{ matrix.variant }}-artifacts
          path: ${{ matrix.module }}/build/libs/*.jar

  publish:
    name: Publish (${{ matrix.module }} / ${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs:
      - matrix
      - build
    if: github.ref == 'refs/heads/master' || github.ref_type == 'tag'

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: oracle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          
      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Publish
        run: |
          ./gradlew :${{ matrix.module }}:publish \
            -Pvariable=${{ matrix.variant }} \
            -DincludeModules=${{ matrix.module }} \
            --build-cache --parallel

  pages:
    name: Prepare Gradle scripts for GitHub Pages
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/master' || github.ref_type == 'tag'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: oracle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Determine published version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version=$(./gradlew -q properties | awk -F ': ' '$1 == "version" { print $2; exit }')
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Gradle returned an invalid version path: $version" >&2
            exit 1
          fi

          echo "Publishing Gradle scripts for $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Preserve published scripts
        shell: bash
        run: |
          set -euo pipefail

          scripts=(global.gradle version.gradle remote.gradle sourcegenerator.gradle)
          mkdir -p "$RUNNER_TEMP/gradle-scripts"

          for script in "${scripts[@]}"; do
            test -f "$script"
            cp "$script" "$RUNNER_TEMP/gradle-scripts/$script"
          done

      - name: Checkout pages state branch
        id: checkout-state
        uses: actions/checkout@v4
        with:
          ref: pages-state
          fetch-depth: 0
          persist-credentials: true
        continue-on-error: true

      - name: Create pages state branch
        if: steps.checkout-state.outcome == 'failure'
        run: |
          git switch --orphan pages-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Initialize Pages state"
          git push -u origin pages-state

      - name: Checkout confirmed pages state branch
        if: steps.checkout-state.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          ref: pages-state
          fetch-depth: 0
          persist-credentials: true

      - name: Add published version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail

          scripts=(global.gradle version.gradle remote.gradle sourcegenerator.gradle)
          sourceDir="$RUNNER_TEMP/gradle-scripts"
          targetDir="output/$VERSION"

          if [[ -e "$targetDir" ]]; then
            for script in "${scripts[@]}"; do
              if ! cmp --silent "$sourceDir/$script" "$targetDir/$script"; then
                echo "Published version $VERSION already exists with different $script" >&2
                exit 1
              fi
            done
          else
            mkdir -p "$targetDir"
            for script in "${scripts[@]}"; do
              cp "$sourceDir/$script" "$targetDir/$script"
            done
          fi

      - name: Commit published version
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Publish Gradle scripts for ${{ steps.version.outputs.value }}
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: pages-state
          file_pattern: output

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: output

  pages-deploy:
    name: Deploy Gradle scripts to GitHub Pages
    runs-on: ubuntu-latest
    needs: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-artifacts'
          path: artifacts

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.jar
